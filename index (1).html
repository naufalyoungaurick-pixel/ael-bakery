<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ael Bakery – Roti Segar Setiap Hari</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--coklat:#7a4a21;--krim:#fff7ec;--emas:#e0a24a;--teks:#3b2a1a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--krim);color:var(--teks)}
header{background:var(--coklat);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.4rem}
#btnKeranjang{background:var(--emas);border:0;padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer}
.hero{text-align:center;padding:48px 20px}
.hero h2{font-size:2rem;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding:0 20px 40px;max-width:1100px;margin:auto}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:160px;object-fit:cover;background:#eee}
.card div{padding:14px}
.card h3{margin:0 0 4px}
.card p{margin:0 0 8px;font-size:.9rem;color:#6b5a4a}
.harga{font-weight:700;color:var(--coklat)}
.card button{margin-top:10px;width:100%;background:var(--coklat);color:#fff;border:0;padding:10px;border-radius:8px;cursor:pointer}
#panel{position:fixed;right:0;top:0;height:100%;width:min(380px,100%);background:#fff;box-shadow:-4px 0 20px #0003;padding:20px;transform:translateX(100%);transition:.25s;z-index:10;overflow:auto}
#panel.buka{transform:none}
#panel input,#panel textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font:inherit}
.item{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eee}
.item button{border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer;width:26px}
#kirim{width:100%;background:var(--coklat);color:#fff;border:0;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:8px}
footer{text-align:center;padding:24px;color:#6b5a4a}
</style>
</head>
<body>
<header>
  <h1>🥐 Ael Bakery</h1>
  <button id="btnKeranjang">Keranjang (<span id="jumlah">0</span>)</button>
</header>

<section class="hero">
  <h2>Roti segar, dipanggang setiap hari</h2>
  <p>Pilih rotimu, isi data, dan kami siapkan pesananmu.</p>
</section>

<main class="grid" id="produk"><p>Memuat produk…</p></main>

<aside id="panel">
  <h2>Keranjang</h2>
  <div id="isiKeranjang"></div>
  <p><b>Total: <span id="total">Rp0</span></b></p>
  <input id="nama" placeholder="Nama kamu">
  <input id="hp" placeholder="No. WhatsApp (contoh 0812xxxx)">
  <textarea id="alamat" rows="3" placeholder="Alamat pengantaran"></textarea>
  <button id="kirim">Pesan Sekarang</button>
  <button id="tutup" style="width:100%;margin-top:8px;border:0;background:none;cursor:pointer">Tutup</button>
</aside>

<footer>© Ael Bakery</footer>

<script>
// ====== GANTI DUA BARIS INI DENGAN MILIKMU (Supabase > Project Settings > API) ======
const SUPABASE_URL = "https://iybhzovecumcjlbpmafp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_leyh1dMH8Qi7l8LNz7tdbQ_JsnCiB58";
// ====== Nomor WhatsApp toko (format 62, tanpa +) ======
const WA_TOKO = "6281350147104;
// =====================================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const rp = n => "Rp" + n.toLocaleString("id-ID");
let produk = [], keranjang = {};

async function muat(){
  const {data, error} = await db.from("products").select("*").eq("is_available", true).order("id");
  const el = document.getElementById("produk");
  if(error){ el.innerHTML = "<p>Gagal memuat produk. Cek pengaturan Supabase.</p>"; return; }
  produk = data;
  el.innerHTML = data.map(p => `
    <div class="card">
      <img src="${p.image_url || ""}" alt="${p.name}">
      <div>
        <h3>${p.name}</h3>
        <p>${p.description || ""}</p>
        <span class="harga">${rp(p.price)}</span>
        <button onclick="tambah(${p.id})">+ Tambah</button>
      </div>
    </div>`).join("");
}

function tambah(id){ keranjang[id] = (keranjang[id]||0)+1; render(); }
function ubah(id,d){ keranjang[id] += d; if(keranjang[id]<=0) delete keranjang[id]; render(); }

function render(){
  let total = 0, jml = 0, html = "";
  for(const id in keranjang){
    const p = produk.find(x => x.id == id), q = keranjang[id];
    total += p.price*q; jml += q;
    html += `<div class="item"><span>${p.name}</span>
      <span><button onclick="ubah(${id},-1)">−</button> ${q} <button onclick="ubah(${id},1)">+</button></span></div>`;
  }
  document.getElementById("isiKeranjang").innerHTML = html || "<p>Keranjang masih kosong.</p>";
  document.getElementById("total").textContent = rp(total);
  document.getElementById("jumlah").textContent = jml;
}

document.getElementById("btnKeranjang").onclick = () => document.getElementById("panel").classList.add("buka");
document.getElementById("tutup").onclick = () => document.getElementById("panel").classList.remove("buka");

document.getElementById("kirim").onclick = async () => {
  const nama = document.getElementById("nama").value.trim();
  const hp = document.getElementById("hp").value.trim();
  const alamat = document.getElementById("alamat").value.trim();
  if(!Object.keys(keranjang).length) return alert("Keranjang masih kosong.");
  if(!nama || !hp) return alert("Isi nama dan nomor WhatsApp dulu ya.");

  const items = Object.keys(keranjang).map(id => {
    const p = produk.find(x => x.id == id);
    return {name:p.name, qty:keranjang[id], price:p.price};
  });
  const total = items.reduce((s,i)=>s+i.qty*i.price,0);

  const {error} = await db.from("orders").insert({customer_name:nama, phone:hp, address:alamat, items, total});
  if(error) return alert("Pesanan gagal dikirim, coba lagi.");

  const pesan = `Halo Ael Bakery, saya ${nama}.%0APesanan:%0A` +
    items.map(i=>`- ${i.name} x${i.qty}`).join("%0A") +
    `%0ATotal: ${rp(total)}%0AAlamat: ${encodeURIComponent(alamat)}`;
  window.open(`https://wa.me/${WA_TOKO}?text=${pesan}`, "_blank");
  keranjang = {}; render();
  document.getElementById("panel").classList.remove("buka");
  alert("Pesanan terkirim! Terima kasih 🙏");
};

muat(); render();
</script>
</body>
</html>
