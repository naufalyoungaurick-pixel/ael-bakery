<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ael Bakery – Menu roti, donat, pastry, dan cake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--pandan:#24493a;--gelap:#183327;--mentega:#f4d35e;--tepung:#fbfaf6;--kerak:#8b4a1e;--tinta:#1d2b24;--abu:#5d6b63;--garis:#cfd6cf;
--display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);font-size:1.02rem;line-height:1.5;background:var(--tepung);color:var(--tinta)}
:focus-visible{outline:3px solid var(--mentega);outline-offset:2px}
button,input,textarea{font:inherit}button{cursor:pointer}
.atas{background:var(--pandan);color:var(--tepung)}
.bar{max-width:1080px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.bar button{background:var(--mentega);color:var(--gelap);border:0;border-radius:999px;padding:9px 18px;font-weight:700}
.hero{max-width:1080px;margin:auto;padding:28px 20px 56px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,8vw,5rem);line-height:.95;letter-spacing:-.035em;margin:0 0 16px;max-width:12ch}
.hero p{max-width:36ch;margin:0;color:#d7e3da}
/* navigasi */
.nav{position:sticky;top:0;z-index:4;background:var(--tepung);border-bottom:1px solid var(--garis)}
.nav div{max-width:1080px;margin:auto;padding:10px 20px;display:flex;gap:10px;align-items:center}
.nav input{flex:0 0 110px;padding:9px 14px;border:1px solid #aab4ac;border-radius:999px;background:#fff;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1}
.chips::-webkit-scrollbar{display:none}
.chips a{white-space:nowrap;text-decoration:none;color:var(--tinta);border:1px solid var(--garis);border-radius:999px;padding:7px 14px;font-weight:500}
.chips a.on{background:var(--pandan);border-color:var(--pandan);color:#fff}
/* seksi */
main{max-width:1080px;margin:auto;padding:0 20px 120px}
section{padding-top:56px;scroll-margin-top:60px}
.kepala{display:flex;align-items:flex-end;gap:16px;margin-bottom:46px;border-left:12px solid var(--t);padding-left:14px}
.kepala h2{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.2rem);line-height:1;letter-spacing:-.03em;margin:0}
.kepala p{margin:0;color:var(--abu);max-width:40ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:56px 16px}
.hs{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:60px 4px 18px;margin-top:-52px}
.hs .kartu{flex:0 0 200px;scroll-snap-align:start}
.kartu{position:relative;background:color-mix(in srgb,var(--t) 42%,#fff);border-radius:22px;padding:0 14px 14px;display:flex;flex-direction:column}
.kartu>img{width:82%;aspect-ratio:1;object-fit:contain;margin:-52px auto 2px;display:block;filter:drop-shadow(0 10px 9px #0003)}
.kartu h3{font-family:var(--display);font-weight:500;font-size:1.12rem;line-height:1.15;margin:4px 0 0;letter-spacing:-.01em}
.note{margin:4px 0 0;font-size:.85rem;color:var(--abu)}
.bawah{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:12px}
.harga{font-weight:700;color:var(--kerak)}
.var{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed #0003;font-size:.92rem}
.var:first-of-type{margin-top:10px}
.var .harga{display:block}
.tambah{background:var(--pandan);color:#fff;border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:.92rem}
.tambah:hover{background:var(--gelap)}
.step{display:inline-flex;align-items:center;background:var(--mentega);border-radius:999px;padding:2px}
.step button{width:30px;height:30px;border:0;border-radius:50%;background:transparent;font-size:1.1rem;font-weight:700;color:var(--gelap)}
.step button:hover{background:#0001}.step b{min-width:20px;text-align:center}
.besar{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:56px 16px}
/* donat */
.rasa-j{font-family:var(--display);font-weight:800;font-size:1.4rem;margin:44px 0 18px}
.rasa{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.r{display:flex;gap:14px;align-items:center;background:color-mix(in srgb,var(--t) 30%,#fff);border-radius:999px 22px 22px 999px;padding:8px 18px 8px 8px}
.r img{width:84px;height:84px;object-fit:contain;flex:none;filter:drop-shadow(0 5px 5px #0003)}
.r b{font-family:var(--display);font-weight:500;display:block;line-height:1.15}
.r span{font-size:.82rem;color:var(--abu);line-height:1.3;display:block;margin-top:2px}
/* cake custom */
.gal{display:flex;gap:10px;overflow-x:auto;padding:6px 0 14px}
.gal img{height:150px;width:auto;flex:none;filter:drop-shadow(0 8px 7px #0003)}
details{border:1px solid var(--garis);border-radius:16px;padding:4px 16px;margin-bottom:10px;background:#fff}
summary{font-family:var(--display);font-weight:500;font-size:1.15rem;padding:10px 0;cursor:pointer}
details .var{border-top:1px dashed var(--garis)}details .var:first-of-type{margin-top:0}
.kosong{padding:60px 0;color:var(--abu)}
.hide{display:none!important}
footer{border-top:1px solid var(--garis);padding:28px 20px 100px;text-align:center;color:var(--abu)}
/* keranjang */
#bilah{position:fixed;left:0;right:0;bottom:0;background:var(--gelap);color:var(--tepung);transform:translateY(100%);transition:transform .25s;z-index:5}
#bilah.ada{transform:none}
#bilah div{max-width:1080px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
#bilah button{background:var(--mentega);color:var(--gelap);border:0;border-radius:999px;padding:10px 20px;font-weight:700}
#latar{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .25s;z-index:6}
#latar.buka{opacity:1;pointer-events:auto}
#laci{position:fixed;right:0;top:0;height:100%;width:min(420px,100%);background:var(--tepung);padding:22px;transform:translateX(100%);transition:transform .25s;overflow:auto;z-index:7}
#laci.buka{transform:none}
#laci h2{font-family:var(--display);font-weight:800;margin:0 0 12px}
.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--garis)}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin:14px 0}
label{display:block;font-weight:500;font-size:.92rem;margin-top:10px}
#laci input,#laci textarea{width:100%;padding:11px;margin-top:4px;border:1px solid #aab4ac;border-radius:8px;background:#fff}
#kirim{width:100%;margin-top:16px;background:var(--pandan);color:#fff;border:0;border-radius:999px;padding:13px;font-weight:700}
#tutup{width:100%;margin-top:6px;background:none;border:0;padding:10px;color:var(--abu)}
@media(max-width:560px){.nav input{flex-basis:84px}.kepala{flex-direction:column;align-items:flex-start;gap:6px}.rasa{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="atas">
  <div class="bar"><span class="logo">Ael Bakery</span><button id="btnKeranjang" type="button">Keranjang (<span id="jumlah">0</span>)</button></div>
  <div class="hero"><h1>Roti, donat, dan cake segar.</h1><p>Pilih dari menu lengkap kami, lalu kirim pesananmu lewat WhatsApp.</p></div>
</div>

<nav class="nav" aria-label="Kategori menu"><div>
  <input id="cari" type="search" placeholder="Cari" aria-label="Cari menu">
  <div class="chips" id="chips"></div>
</div></nav>

<main id="menu"></main>

<div id="bilah"><div><span><b id="bJumlah">0</b> item · <b id="bTotal">Rp0</b></span><button id="bBuka" type="button">Lihat pesanan</button></div></div>
<div id="latar"></div>
<aside id="laci" aria-label="Pesanan">
  <h2>Pesananmu</h2>
  <div id="isiKeranjang"></div>
  <div class="total"><span>Total</span><span id="total">Rp0</span></div>
  <label for="nama">Nama</label><input id="nama" autocomplete="name">
  <label for="hp">Nomor WhatsApp</label><input id="hp" inputmode="tel" placeholder="0812xxxxxxx" autocomplete="tel">
  <label for="alamat">Alamat pengantaran</label><textarea id="alamat" rows="2" autocomplete="street-address"></textarea>
  <label for="catatan">Catatan (varian rasa, tanggal ambil, dll.)</label><textarea id="catatan" rows="2"></textarea>
  <button id="kirim" type="button">Kirim pesanan</button>
  <button id="tutup" type="button">Kembali ke menu</button>
</aside>
<footer>© Ael Bakery</footer>

<script src="menu.js"></script>
<script>
// ===== Isi sendiri =====
const WA_TOKO = "6281350147104";            // nomor WhatsApp toko, format 62 tanpa +
const SUPABASE_URL = "https://XXXXXXXX.supabase.co";   // opsional: untuk menyimpan pesanan
const SUPABASE_ANON_KEY = "ISI_ANON_PUBLIC_KEY";       // opsional
// =======================

const $ = id => document.getElementById(id);
const rp = n => "Rp" + n.toLocaleString("id-ID");
const K = {}; let keranjang = {};

const ctlHtml = k => { const q = keranjang[k] ? keranjang[k].q : 0;
  return q ? `<span class="step"><button type="button" aria-label="Kurangi" onclick="ubah('${k}',-1)">−</button><b>${q}</b><button type="button" aria-label="Tambah" onclick="ubah('${k}',1)">+</button></span>`
           : `<button class="tambah" type="button" onclick="ubah('${k}',1)">Tambah</button>`; };
const ctl = k => `<span data-k="${k}">${ctlHtml(k)}</span>`;
function reg(id,i,name,label,price){ const k = id+"|"+i; K[k] = {n: label ? name+" – "+label : name, p: price}; return k; }

function kartu(it){
  let isi;
  if(it.v.length === 1){ const k = reg(it.id,0,it.n,it.v[0][0],it.v[0][1]);
    isi = `<div class="bawah"><span class="harga">${rp(it.v[0][1])}</span>${ctl(k)}</div>`;
  } else {
    isi = it.v.map((v,i)=>{ const k = reg(it.id,i,it.n,v[0],v[1]);
      return `<div class="var"><span>${v[0]}<span class="harga">${rp(v[1])}</span></span>${ctl(k)}</div>`; }).join("");
  }
  return `<article class="kartu" data-n="${it.n.toLowerCase()}">${it.img?`<img src="${it.img}" alt="${it.n}" loading="lazy">`:""}<h3>${it.n}</h3>${it.note?`<p class="note">${it.note}</p>`:""}${isi}</article>`;
}

function seksi(c){
  let h = `<section id="${c.id}" style="--t:${c.w}"><div class="kepala"><h2>${c.t}</h2><p>${c.k}</p></div>`;
  if(c.m === "hs") h += `<div class="hs">${c.items.map(kartu).join("")}</div>`;
  else if(c.m === "donat"){
    h += `<div class="besar">${c.items.map(kartu).join("")}</div><h3 class="rasa-j">Pilihan rasa</h3><div class="rasa">` +
      c.rasa.map(r=>`<div class="r" data-n="${r.n.toLowerCase()}"><img src="${r.img}" alt="${r.n}" loading="lazy"><div><b>${r.n}</b><span>${r.d}</span></div></div>`).join("") + `</div>`;
  } else {
    h += `<div class="grid">${c.items.map(kartu).join("")}</div>`;
    if(c.m === "cake"){
      h += `<h3 class="rasa-j">Kue ulang tahun custom</h3><div class="gal">${c.gal.map(g=>`<img src="${g}" alt="Contoh kue ulang tahun" loading="lazy">`).join("")}</div>` +
        c.custom.map(x=>`<details data-n="${x.n.toLowerCase()} kue ulang tahun"><summary>${x.n}</summary>${x.v.map((v,i)=>{const k=reg("kut-"+x.id,i,"Kue ulang tahun "+x.n,v[0],v[1]);return `<div class="var"><span>${v[0]}<span class="harga">${rp(v[1])}</span></span>${ctl(k)}</div>`}).join("")}</details>`).join("");
    }
  }
  return h + "</section>";
}

$("menu").innerHTML = MENU.map(seksi).join("") + `<p class="kosong hide" id="kosong">Menu tidak ditemukan. Coba kata lain.</p>`;
$("chips").innerHTML = MENU.map(c=>`<a href="#${c.id}" data-s="${c.id}">${c.t}</a>`).join("");

function ubah(k,d){
  const q = ((keranjang[k]||{}).q||0) + d;
  if(q <= 0) delete keranjang[k]; else keranjang[k] = {...K[k], q};
  document.querySelectorAll(`[data-k="${k}"]`).forEach(e => e.innerHTML = ctlHtml(k));
  render();
}
function render(){
  let total = 0, jml = 0, html = "";
  for(const k in keranjang){ const x = keranjang[k]; total += x.p*x.q; jml += x.q;
    html += `<div class="item"><span>${x.q} × ${x.n}</span><span>${rp(x.p*x.q)}</span></div>`; }
  $("isiKeranjang").innerHTML = html || "<p>Belum ada item di pesanan. Pilih dari menu.</p>";
  $("total").textContent = rp(total); $("jumlah").textContent = jml; $("bJumlah").textContent = jml; $("bTotal").textContent = rp(total);
  $("bilah").classList.toggle("ada", jml > 0);
}

/* cari */
$("cari").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(); let ada = 0;
  document.querySelectorAll("section").forEach(s => {
    let n = 0;
    s.querySelectorAll("[data-n]").forEach(el => { const ok = !q || el.dataset.n.includes(q); el.classList.toggle("hide", !ok); if(ok) n++; });
    s.classList.toggle("hide", !n); ada += n;
  });
  $("kosong").classList.toggle("hide", ada > 0);
});

/* kategori aktif */
const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){
  document.querySelectorAll(".chips a").forEach(a => a.classList.toggle("on", a.dataset.s === e.target.id));
  const on = document.querySelector(".chips a.on"); if(on) on.scrollIntoView({inline:"center",block:"nearest"}); } }), {rootMargin:"-30% 0px -60% 0px"});
document.querySelectorAll("section").forEach(s => io.observe(s));

/* keranjang & kirim */
const buka = () => { $("laci").classList.add("buka"); $("latar").classList.add("buka"); };
const tutup = () => { $("laci").classList.remove("buka"); $("latar").classList.remove("buka"); };
$("btnKeranjang").onclick = buka; $("bBuka").onclick = buka; $("tutup").onclick = tutup; $("latar").onclick = tutup;
document.addEventListener("keydown", e => { if(e.key === "Escape") tutup(); });

$("kirim").onclick = async () => {
  const nama = $("nama").value.trim(), hp = $("hp").value.trim(), alamat = $("alamat").value.trim(), catatan = $("catatan").value.trim();
  const ks = Object.keys(keranjang);
  if(!ks.length) return alert("Pilih minimal satu item dulu.");
  if(!nama || !hp) return alert("Isi nama dan nomor WhatsApp dulu.");
  const items = ks.map(k => ({name: keranjang[k].n, qty: keranjang[k].q, price: keranjang[k].p}));
  const total = items.reduce((s,i) => s + i.qty*i.price, 0);

  // Simpan ke Supabase kalau sudah diisi. Kalau gagal, pesanan tetap dikirim lewat WhatsApp.
  try{
    if(typeof supabase !== "undefined" && !SUPABASE_URL.includes("XXXX") && !SUPABASE_ANON_KEY.includes("ISI_ANON")){
      await supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY).from("orders")
        .insert({customer_name: nama, phone: hp, address: alamat + (catatan ? " | Catatan: " + catatan : ""), items, total});
    }
  }catch(e){ console.warn("Pesanan belum tersimpan di Supabase:", e); }

  const teks = `Halo Ael Bakery, saya ${nama} (${hp}).\nPesanan:\n` + items.map(i => `- ${i.name} x${i.qty} (${rp(i.price*i.qty)})`).join("\n") +
    `\nTotal: ${rp(total)}` + (alamat ? `\nAlamat: ${alamat}` : "") + (catatan ? `\nCatatan: ${catatan}` : "");
  window.open(`https://wa.me/${WA_TOKO}?text=${encodeURIComponent(teks)}`, "_blank");
  ks.forEach(k => { delete keranjang[k]; document.querySelectorAll(`[data-k="${k}"]`).forEach(e => e.innerHTML = ctlHtml(k)); });
  render(); tutup();
};
render();
</script>
</body>
</html>
