<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ael Bakery – Roti segar setiap hari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --pandan:#24493a; --pandan-gelap:#183327; --mentega:#f4d35e;
  --tepung:#fbfaf6; --kerak:#8b4a1e; --tinta:#1d2b24; --abu:#5d6b63; --garis:#cfd6cf;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);font-size:1.05rem;line-height:1.55;background:var(--tepung);color:var(--tinta)}
:focus-visible{outline:3px solid var(--mentega);outline-offset:2px}
button{font:inherit;cursor:pointer}

/* Atas */
.atas{background:var(--pandan);color:var(--tepung)}
.bar{max-width:880px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.bar button{background:var(--mentega);color:var(--pandan-gelap);border:0;border-radius:999px;padding:9px 18px;font-weight:700}
.hero{max-width:880px;margin:auto;padding:44px 20px 64px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,9vw,5.6rem);line-height:.95;letter-spacing:-.035em;margin:0 0 20px;max-width:11ch}
.hero p{max-width:34ch;margin:0 0 26px;color:#d7e3da}
.hero a{display:inline-block;background:var(--tepung);color:var(--pandan-gelap);text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px}

/* Papan menu */
.menu{max-width:880px;margin:auto;padding:48px 20px 120px}
.menu h2{font-family:var(--display);font-weight:800;font-size:1.9rem;letter-spacing:-.02em;margin:0 0 4px}
.menu .ket{margin:0 0 28px;color:var(--abu)}
.baris{display:grid;grid-template-columns:76px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--garis)}
.baris:last-child{border-bottom:1px solid var(--garis)}
.baris img{width:76px;height:76px;object-fit:cover;border-radius:38px 38px 10px 10px;background:#e4e8e2}
.info .judul{display:flex;align-items:baseline;gap:10px}
.info h3{font-family:var(--display);font-weight:500;font-size:1.25rem;margin:0;letter-spacing:-.01em}
.titik{flex:1;border-bottom:2px dotted var(--garis);transform:translateY(-4px);min-width:20px}
.harga{font-weight:700;color:var(--kerak);white-space:nowrap}
.info p{margin:2px 0 0;color:var(--abu);font-size:.95rem;max-width:46ch}
.ctl{min-width:104px;text-align:right}
.tambah{background:var(--pandan);color:var(--tepung);border:0;border-radius:999px;padding:9px 18px;font-weight:700}
.tambah:hover{background:var(--pandan-gelap)}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--mentega);border-radius:999px;padding:3px}
.step button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;font-size:1.2rem;font-weight:700;color:var(--pandan-gelap)}
.step button:hover{background:#0001}
.step b{min-width:22px;text-align:center}
.pesan-kosong{color:#8a1c2b}

/* Bilah keranjang */
#bilah{position:fixed;left:0;right:0;bottom:0;background:var(--pandan-gelap);color:var(--tepung);transform:translateY(100%);transition:transform .25s}
#bilah.ada{transform:none}
#bilah div{max-width:880px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
#bilah button{background:var(--mentega);color:var(--pandan-gelap);border:0;border-radius:999px;padding:10px 20px;font-weight:700}

/* Laci pesanan */
#latar{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .25s}
#latar.buka{opacity:1;pointer-events:auto}
#laci{position:fixed;right:0;top:0;height:100%;width:min(420px,100%);background:var(--tepung);padding:22px;transform:translateX(100%);transition:transform .25s;overflow:auto;z-index:5}
#laci.buka{transform:none}
#laci h2{font-family:var(--display);font-weight:800;margin:0 0 12px}
.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--garis)}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin:14px 0}
label{display:block;font-weight:500;font-size:.92rem;margin-top:10px}
#laci input,#laci textarea{width:100%;padding:11px;margin-top:4px;border:1px solid #aab4ac;border-radius:8px;font:inherit;background:#fff}
#kirim{width:100%;margin-top:16px;background:var(--pandan);color:#fff;border:0;border-radius:999px;padding:13px;font-weight:700}
#tutup{width:100%;margin-top:6px;background:none;border:0;padding:10px;color:var(--abu)}
footer{border-top:1px solid var(--garis);padding:28px 20px 100px;text-align:center;color:var(--abu)}

@media (max-width:520px){
  .baris{grid-template-columns:64px 1fr;}
  .baris img{width:64px;height:64px;border-radius:32px 32px 8px 8px}
  .ctl{grid-column:2;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="atas">
  <div class="bar">
    <span class="logo">Ael Bakery</span>
    <button id="btnKeranjang" type="button">Keranjang (<span id="jumlah">0</span>)</button>
  </div>
  <div class="hero">
    <h1>Roti hangat, langsung dari oven.</h1>
    <p>Pilih roti yang kamu mau, isi nama dan alamat, pesananmu kami siapkan.</p>
    <a href="#menu">Lihat menu</a>
  </div>
</div>

<main class="menu" id="menu">
  <h2>Menu hari ini</h2>
  <p class="ket">Harga sudah termasuk kemasan.</p>
  <div id="produk"><p>Memuat menu…</p></div>
</main>

<div id="bilah"><div>
  <span><b id="bJumlah">0</b> roti · <b id="bTotal">Rp0</b></span>
  <button id="bBuka" type="button">Lihat pesanan</button>
</div></div>

<div id="latar"></div>
<aside id="laci" aria-label="Pesanan">
  <h2>Pesananmu</h2>
  <div id="isiKeranjang"></div>
  <div class="total"><span>Total</span><span id="total">Rp0</span></div>
  <label for="nama">Nama</label>
  <input id="nama" autocomplete="name">
  <label for="hp">Nomor WhatsApp</label>
  <input id="hp" inputmode="tel" placeholder="0812xxxxxxx" autocomplete="tel">
  <label for="alamat">Alamat pengantaran</label>
  <textarea id="alamat" rows="3" autocomplete="street-address"></textarea>
  <button id="kirim" type="button">Kirim pesanan</button>
  <button id="tutup" type="button">Kembali ke menu</button>
</aside>

<footer>© Ael Bakery</footer>

<script>
// ====== GANTI DUA BARIS INI DENGAN MILIKMU (Supabase > Project Settings > API) ======
const SUPABASE_URL = "https://XXXXXXXX.supabase.co";
const SUPABASE_ANON_KEY = "ISI_ANON_PUBLIC_KEY";
// ====== Nomor WhatsApp toko (format 62, tanpa +) ======
const WA_TOKO = "6281234567890";
// =====================================================================

const rp = n => "Rp" + n.toLocaleString("id-ID");
const $ = id => document.getElementById(id);
let db, produk = [], keranjang = {};

function tampilError(teks){
  $("produk").innerHTML = "<p class='pesan-kosong'><b>Menu belum bisa dimuat.</b><br>" + teks + "</p>";
}

async function muat(){
  try{
    if(typeof supabase === "undefined") return tampilError("Library Supabase tidak termuat. Cek koneksi internet.");
    if(SUPABASE_URL.includes("XXXX") || SUPABASE_ANON_KEY.includes("ISI_ANON")) return tampilError("SUPABASE_URL dan SUPABASE_ANON_KEY di index.html belum diganti.");
    db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const {data, error} = await db.from("products").select("*").eq("is_available", true).order("id");
    if(error) return tampilError("Pesan dari Supabase: " + error.message);
    if(!data.length) return tampilError("Tabel products masih kosong. Jalankan supabase.sql.");
    produk = data;
    $("produk").innerHTML = data.map(p => `
      <div class="baris">
        <img src="${p.image_url || ""}" alt="${p.name}" loading="lazy">
        <div class="info">
          <div class="judul"><h3>${p.name}</h3><span class="titik"></span><span class="harga">${rp(p.price)}</span></div>
          <p>${p.description || ""}</p>
        </div>
        <div class="ctl" id="ctl${p.id}"></div>
      </div>`).join("");
    data.forEach(p => ctl(p.id));
  }catch(e){ tampilError("Error: " + e.message); }
}

function ctl(id){
  const q = keranjang[id] || 0;
  $("ctl"+id).innerHTML = q
    ? `<span class="step"><button type="button" aria-label="Kurangi" onclick="ubah(${id},-1)">−</button><b>${q}</b><button type="button" aria-label="Tambah" onclick="ubah(${id},1)">+</button></span>`
    : `<button class="tambah" type="button" onclick="ubah(${id},1)">Tambah</button>`;
}

function ubah(id,d){
  keranjang[id] = (keranjang[id]||0)+d;
  if(keranjang[id]<=0) delete keranjang[id];
  ctl(id); render();
}

function render(){
  let total = 0, jml = 0, html = "";
  for(const id in keranjang){
    const p = produk.find(x => x.id == id), q = keranjang[id];
    total += p.price*q; jml += q;
    html += `<div class="item"><span>${q} × ${p.name}</span><span>${rp(p.price*q)}</span></div>`;
  }
  $("isiKeranjang").innerHTML = html || "<p>Belum ada roti di pesanan. Pilih dari menu.</p>";
  $("total").textContent = rp(total);
  $("jumlah").textContent = jml; $("bJumlah").textContent = jml; $("bTotal").textContent = rp(total);
  $("bilah").classList.toggle("ada", jml > 0);
}

const buka = () => { $("laci").classList.add("buka"); $("latar").classList.add("buka"); };
const tutup = () => { $("laci").classList.remove("buka"); $("latar").classList.remove("buka"); };
$("btnKeranjang").onclick = buka; $("bBuka").onclick = buka;
$("tutup").onclick = tutup; $("latar").onclick = tutup;
document.addEventListener("keydown", e => { if(e.key === "Escape") tutup(); });

$("kirim").onclick = async () => {
  const nama = $("nama").value.trim(), hp = $("hp").value.trim(), alamat = $("alamat").value.trim();
  if(!Object.keys(keranjang).length) return alert("Pilih minimal satu roti dulu.");
  if(!nama || !hp) return alert("Isi nama dan nomor WhatsApp dulu.");

  const items = Object.keys(keranjang).map(id => {
    const p = produk.find(x => x.id == id);
    return {name:p.name, qty:keranjang[id], price:p.price};
  });
  const total = items.reduce((s,i)=>s+i.qty*i.price,0);

  const {error} = await db.from("orders").insert({customer_name:nama, phone:hp, address:alamat, items, total});
  if(error) return alert("Pesanan belum terkirim: " + error.message);

  const pesan = `Halo Ael Bakery, saya ${nama}.%0APesanan:%0A` +
    items.map(i=>`- ${i.name} x${i.qty}`).join("%0A") +
    `%0ATotal: ${rp(total)}%0AAlamat: ${encodeURIComponent(alamat)}`;
  window.open(`https://wa.me/${WA_TOKO}?text=${pesan}`, "_blank");
  const ids = Object.keys(keranjang); keranjang = {}; ids.forEach(ctl); render(); tutup();
  alert("Pesanan terkirim. Terima kasih!");
};

muat(); render();
</script>
</body>
</html>
